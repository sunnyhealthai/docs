asyncapi: 2.6.0
info:
  title: Sunny Health WebSocket API
  version: 0.3.0
  description: |
    Real-time bidirectional WebSocket API for the Sunny Health AI chat platform.

    All connections start anonymous. Authentication happens via in-band messages
    (`auth.upgrade`, `passwordless.*`) after the WebSocket is established.

    ## Connection lifecycle

    1. Client opens `GET /ws` (upgraded to WebSocket).
    2. Server sends `session.started` with the session ID.
    3. (SDK connections) Client sends `sdk.session.create` with a public API key.
    4. Client optionally authenticates via `auth.upgrade` or `passwordless.*`.
    5. Bidirectional message exchange (chat, conversations, appointments, etc.).
    6. Either side closes the connection.

    ## Message framing

    Every message is a JSON object with a `type` discriminator field. Client-to-server
    messages use `InputWebsocketMessage` types; server-to-client messages are either
    application-level `OutputAppMessage` types or pass-through AI streaming events
    (`response.*`) wrapped with a `conversation_id`.

  contact:
    name: Sunny Agents SDK Support
    email: support@sunnyhealthai.com

servers:
  staging:
    url: wss://chat.api.sunnyhealthai-staging.com
    protocol: wss
    description: Staging WebSocket server
  production:
    url: wss://chat.api.sunnyhealthai.com
    protocol: wss
    description: Production WebSocket server

channels:
  /ws:
    description: |
      Real-time AI chat channel.

      **Query parameters** (appended to the connection URL):

      | Parameter | Required | Description |
      |-----------|----------|-------------|
      | `session_id` | No | Existing session ID for reconnection. If omitted the server generates one. |
      | `partner_identifier` | No | Partner name for SDK connections. Also accepted via `X-Sunny-Partner-Identifier` header. |

      **Origin verification**: SDK connections are verified against the partner's
      configured allowed origins. Non-SDK connections are checked against the
      server's CORS allowed origins.
    bindings:
      ws:
        query:
          type: object
          properties:
            session_id:
              type: string
              description: Existing session ID for reconnection within the same session lifecycle.
            partner_identifier:
              type: string
              description: Partner name for SDK connections (e.g., "acme-health").
        headers:
          type: object
          properties:
            X-Sunny-Partner-Identifier:
              type: string
              description: Alternative to the `partner_identifier` query parameter.
        bindingVersion: 0.1.0
    publish:
      operationId: sendClientMessage
      summary: Messages sent from client to server
      message:
        oneOf:
          - $ref: "#/components/messages/Chat"
          - $ref: "#/components/messages/ConversationCreate"
          - $ref: "#/components/messages/ConversationUpdate"
          - $ref: "#/components/messages/ConversationDelete"
          - $ref: "#/components/messages/ConversationList"
          - $ref: "#/components/messages/ConversationMessages"
          - $ref: "#/components/messages/ChatCancel"
          - $ref: "#/components/messages/FileUpload"
          - $ref: "#/components/messages/ChatFeedback"
          - $ref: "#/components/messages/AppointmentList"
          - $ref: "#/components/messages/AppointmentGet"
          - $ref: "#/components/messages/AuthUpgrade"
          - $ref: "#/components/messages/AuthRefresh"
          - $ref: "#/components/messages/PasswordlessStart"
          - $ref: "#/components/messages/PasswordlessVerify"
          - $ref: "#/components/messages/SdkSessionCreate"
    subscribe:
      operationId: receiveServerMessage
      summary: Messages sent from server to client
      message:
        oneOf:
          # Session / SDK
          - $ref: "#/components/messages/SessionStarted"
          - $ref: "#/components/messages/SdkSessionCreated"
          - $ref: "#/components/messages/SdkSessionCreateFailed"
          # Auth
          - $ref: "#/components/messages/AuthUpgraded"
          - $ref: "#/components/messages/AuthUpgradeFailed"
          - $ref: "#/components/messages/AuthRefreshed"
          - $ref: "#/components/messages/AuthRefreshFailed"
          - $ref: "#/components/messages/PasswordlessOtpSent"
          - $ref: "#/components/messages/PasswordlessOtpSentFailed"
          - $ref: "#/components/messages/PasswordlessVerifyFailed"
          # Conversations
          - $ref: "#/components/messages/ConversationCreated"
          - $ref: "#/components/messages/ConversationUpdated"
          - $ref: "#/components/messages/ConversationDeleted"
          - $ref: "#/components/messages/ConversationMigrated"
          - $ref: "#/components/messages/ConversationListResponse"
          - $ref: "#/components/messages/ConversationMessagesResponse"
          # Chat streaming
          - $ref: "#/components/messages/ChatMessageStarted"
          - $ref: "#/components/messages/ChatCancelled"
          - $ref: "#/components/messages/ChatQuickResponses"
          - $ref: "#/components/messages/ChatFeedbackSubmitted"
          # Files
          - $ref: "#/components/messages/FileUploaded"
          # Appointments
          - $ref: "#/components/messages/AppointmentListResponse"
          - $ref: "#/components/messages/AppointmentDetails"
          - $ref: "#/components/messages/AppointmentUpdated"
          # Errors
          - $ref: "#/components/messages/ErrorMessage"
          # AI streaming pass-through
          - $ref: "#/components/messages/ResponseStreamEvent"

components:
  messages:
    # =====================================================================
    # CLIENT -> SERVER MESSAGES
    # =====================================================================

    Chat:
      name: chat
      title: Send Chat Message
      summary: Send user message items to the AI assistant within a conversation.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatPayload"

    ConversationCreate:
      name: conversation.create
      title: Create Conversation
      summary: Create a new conversation, optionally with a title.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ConversationCreatePayload"

    ConversationUpdate:
      name: conversation.update
      title: Update Conversation
      summary: Update an existing conversation (e.g., rename).
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ConversationUpdatePayload"

    ConversationDelete:
      name: conversation.delete
      title: Delete Conversation
      summary: Delete a conversation by ID.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ConversationDeletePayload"

    ConversationList:
      name: conversation.list
      title: List Conversations
      summary: Retrieve a paginated list of the user's conversations.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ConversationListPayload"

    ConversationMessages:
      name: conversation.messages
      title: List Messages
      summary: Retrieve messages for a specific conversation.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ConversationMessagesPayload"

    ChatCancel:
      name: chat.cancel
      title: Cancel Chat Stream
      summary: Cancel an ongoing AI response stream for a conversation.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatCancelPayload"

    FileUpload:
      name: file.upload
      title: Upload Files
      summary: Upload base64-encoded file attachments to a conversation.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/FileUploadPayload"

    ChatFeedback:
      name: chat.feedback
      title: Submit Feedback
      summary: Submit positive or negative feedback on an assistant message.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatFeedbackPayload"

    AppointmentList:
      name: appointment.list
      title: List Appointments
      summary: Retrieve a paginated list of the user's appointments.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/AppointmentListPayload"

    AppointmentGet:
      name: appointment.get
      title: Get Appointment
      summary: Retrieve details for a specific appointment.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/AppointmentGetPayload"

    AuthUpgrade:
      name: auth.upgrade
      title: Upgrade Authentication
      summary: |
        Upgrade from anonymous to authenticated user using a Bearer token.
        Optionally migrates anonymous conversation history and syncs profile data.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/AuthUpgradePayload"

    AuthRefresh:
      name: auth.refresh
      title: Refresh Authentication Token
      summary: |
        Refresh the authentication token for an already-authenticated session.
        Sent by the SDK when the current access token is near expiry.
        Server responds with `auth.refreshed` or `auth.refresh_failed`.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/AuthRefreshPayload"

    PasswordlessStart:
      name: passwordless.start
      title: Start Passwordless OTP
      summary: |
        Start a passwordless authentication flow by sending an OTP via email or SMS.
        Only available for SDK (partner) connections.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/PasswordlessStartPayload"

    PasswordlessVerify:
      name: passwordless.verify
      title: Verify Passwordless OTP
      summary: |
        Verify a passwordless OTP code and authenticate the user.
        Only available for SDK (partner) connections.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/PasswordlessVerifyPayload"

    SdkSessionCreate:
      name: sdk.session.create
      title: Create SDK Session
      summary: |
        Verify a partner's public API key and establish an SDK session.
        Must be sent after `session.started` and before any other operations
        (for SDK connections). Requires `partner_identifier` at connect time.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/SdkSessionCreatePayload"

    # =====================================================================
    # SERVER -> CLIENT MESSAGES
    # =====================================================================

    SessionStarted:
      name: session.started
      title: Session Started
      summary: Sent immediately after WebSocket upgrade completes. Contains the session ID.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/SessionStartedPayload"

    SdkSessionCreated:
      name: sdk.session.created
      title: SDK Session Created
      summary: SDK session verified successfully. Contains partner auth configuration and optional brand theming.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/SdkSessionCreatedPayload"

    SdkSessionCreateFailed:
      name: sdk.session.create_failed
      title: SDK Session Creation Failed
      summary: SDK session creation failed (invalid API key, partner mismatch, etc.).
      contentType: application/json
      payload:
        $ref: "#/components/schemas/SdkSessionCreateFailedPayload"

    AuthUpgraded:
      name: auth.upgraded
      title: Auth Upgraded
      summary: Authentication upgrade succeeded. The session is now authenticated.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/AuthUpgradedPayload"

    AuthUpgradeFailed:
      name: auth.upgrade_failed
      title: Auth Upgrade Failed
      summary: Authentication upgrade failed (invalid token, already authenticated, etc.).
      contentType: application/json
      payload:
        $ref: "#/components/schemas/AuthUpgradeFailedPayload"

    AuthRefreshed:
      name: auth.refreshed
      title: Token Refreshed
      summary: Authentication token refresh succeeded.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/AuthRefreshedPayload"

    AuthRefreshFailed:
      name: auth.refresh_failed
      title: Token Refresh Failed
      summary: Authentication token refresh failed (invalid token, not authenticated, etc.).
      contentType: application/json
      payload:
        $ref: "#/components/schemas/AuthRefreshFailedPayload"

    PasswordlessOtpSent:
      name: passwordless.otp_sent
      title: OTP Sent
      summary: Passwordless OTP was sent successfully via the specified connection.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/PasswordlessOtpSentPayload"

    PasswordlessOtpSentFailed:
      name: passwordless.otp_sent_failed
      title: OTP Send Failed
      summary: Failed to send the passwordless OTP.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/PasswordlessOtpSentFailedPayload"

    PasswordlessVerifyFailed:
      name: passwordless.verify_failed
      title: OTP Verify Failed
      summary: Passwordless OTP verification failed (invalid code, expired, etc.).
      contentType: application/json
      payload:
        $ref: "#/components/schemas/PasswordlessVerifyFailedPayload"

    ConversationCreated:
      name: conversation.created
      title: Conversation Created
      summary: A new conversation was created successfully.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ConversationCreatedPayload"

    ConversationUpdated:
      name: conversation.updated
      title: Conversation Updated
      summary: A conversation was updated successfully.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ConversationUpdatedPayload"

    ConversationDeleted:
      name: conversation.deleted
      title: Conversation Deleted
      summary: A conversation was deleted successfully.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ConversationDeletedPayload"

    ConversationMigrated:
      name: conversation.migrated
      title: Conversation Migrated
      summary: An anonymous conversation was migrated to the authenticated user during auth upgrade.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ConversationMigratedPayload"

    ConversationListResponse:
      name: conversation.list
      title: Conversation List
      summary: Response containing a paginated list of conversations.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ConversationListResponsePayload"

    ConversationMessagesResponse:
      name: conversation.messages
      title: Conversation Messages
      summary: Response containing messages for a conversation.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ConversationMessagesResponsePayload"

    ChatMessageStarted:
      name: chat.message.started
      title: Chat Message Started
      summary: |
        Signals the start of a new assistant message stream. Sent before any
        `response.*` streaming events for that message.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatMessageStartedPayload"

    ChatCancelled:
      name: chat.cancelled
      title: Chat Cancelled
      summary: Acknowledgement that the active chat stream was cancelled.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatCancelledPayload"

    ChatQuickResponses:
      name: chat.quick_responses
      title: Quick Responses
      summary: Suggested quick-reply options generated after an assistant message completes.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatQuickResponsesPayload"

    ChatFeedbackSubmitted:
      name: chat.feedback.submitted
      title: Feedback Submitted
      summary: Acknowledgement that message feedback was recorded.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChatFeedbackSubmittedPayload"

    FileUploaded:
      name: file.uploaded
      title: Files Uploaded
      summary: Confirmation that files were uploaded successfully.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/FileUploadedPayload"

    AppointmentListResponse:
      name: appointment.list
      title: Appointment List
      summary: Response containing a paginated list of appointments.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/AppointmentListResponsePayload"

    AppointmentDetails:
      name: appointment.details
      title: Appointment Details
      summary: Response containing full details for a specific appointment.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/AppointmentDetailsPayload"

    AppointmentUpdated:
      name: appointment.updated
      title: Appointment Updated
      summary: |
        Real-time notification that an appointment was updated.
        Pushed automatically via Postgres LISTEN/NOTIFY when appointment data changes.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/AppointmentUpdatedPayload"

    ErrorMessage:
      name: error
      title: Error
      summary: Application-level error response for any failed operation.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ErrorMessagePayload"

    ResponseStreamEvent:
      name: response.*
      title: AI Response Stream Event
      summary: |
        Pass-through streaming events from the upstream AI provider, wrapped with
        a `conversation_id` for multiplexing. These events follow the OpenAI
        Responses API streaming format and include text deltas, output items,
        completion signals, and error events.

        Key event types:
        - `response.created` / `response.queued` / `response.in_progress`
        - `response.output_text.delta` — incremental text chunk
        - `response.output_text.done` — final complete text
        - `response.output_item.added` / `response.output_item.done`
        - `response.content_part.added` / `response.content_part.done`
        - `response.completed` — full response object
        - `response.failed` / `response.incomplete`
        - `response.mcp_call.*` — MCP tool call lifecycle events
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ResponseStreamEventPayload"

  # =====================================================================
  # SCHEMAS
  # =====================================================================
  schemas:
    # --- Client -> Server Payloads ---

    ChatPayload:
      type: object
      required: [type, items, conversation_id]
      properties:
        type:
          type: string
          const: chat
        items:
          type: array
          description: |
            Array of input items (user messages, MCP approval responses, etc.)
            following the OpenAI Responses API `ResponseInputItem` format.
          items:
            type: object
            additionalProperties: true
        conversation_id:
          type: string
          format: uuid
          description: Target conversation ID.

    ConversationCreatePayload:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: conversation.create
        name:
          type: string
          nullable: true
          description: Optional conversation title.

    ConversationUpdatePayload:
      type: object
      required: [type, conversation_id]
      properties:
        type:
          type: string
          const: conversation.update
        conversation_id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
          description: New conversation title.

    ConversationDeletePayload:
      type: object
      required: [type, conversation_id]
      properties:
        type:
          type: string
          const: conversation.delete
        conversation_id:
          type: string
          format: uuid

    ConversationListPayload:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: conversation.list
        limit:
          type: integer
          nullable: true
          description: Maximum number of conversations to return (default 50).
        offset:
          type: integer
          nullable: true
          description: Number of conversations to skip (default 0).

    ConversationMessagesPayload:
      type: object
      required: [type, conversation_id]
      properties:
        type:
          type: string
          const: conversation.messages
        conversation_id:
          type: string
          format: uuid
        limit:
          type: integer
          nullable: true
          description: Maximum number of messages to return (default 100).

    ChatCancelPayload:
      type: object
      required: [type, conversation_id]
      properties:
        type:
          type: string
          const: chat.cancel
        conversation_id:
          type: string
          format: uuid
          description: Conversation whose active stream should be cancelled.

    FileUploadPayload:
      type: object
      required: [type, conversation_id, files]
      properties:
        type:
          type: string
          const: file.upload
        conversation_id:
          type: string
          format: uuid
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileAttachment"

    ChatFeedbackPayload:
      type: object
      required: [type, conversation_id, message_id, feedback]
      properties:
        type:
          type: string
          const: chat.feedback
        conversation_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
          description: ID of the assistant message to rate.
        feedback:
          type: boolean
          description: "`true` for positive feedback, `false` for negative."

    AppointmentListPayload:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: appointment.list
        limit:
          type: integer
          nullable: true
          description: Maximum number of appointments to return (default 50).
        offset:
          type: integer
          nullable: true
          description: Number of appointments to skip (default 0).

    AppointmentGetPayload:
      type: object
      required: [type, appointment_id]
      properties:
        type:
          type: string
          const: appointment.get
        appointment_id:
          type: string
          format: uuid

    AuthUpgradePayload:
      type: object
      required: [type, token]
      properties:
        type:
          type: string
          const: auth.upgrade
        token:
          type: string
          description: Bearer token (access token from Auth0 token exchange or passwordless flow).
        migrate_history:
          type: boolean
          default: false
          description: Whether to migrate anonymous conversation history to the authenticated user.
        user_profile:
          $ref: "#/components/schemas/AuthUpgradeProfile"
        user_address:
          $ref: "#/components/schemas/AuthUpgradeAddress"
        insurances:
          type: array
          nullable: true
          description: Optional insurance records (SDK partner pre-collected data).
          items:
            $ref: "#/components/schemas/AuthUpgradeInsurance"
        dependents:
          type: array
          nullable: true
          description: Optional dependent records (SDK partner pre-collected data).
          items:
            $ref: "#/components/schemas/AuthUpgradeDependent"

    PasswordlessStartPayload:
      type: object
      required: [type, connection]
      properties:
        type:
          type: string
          const: passwordless.start
        connection:
          type: string
          enum: [email, sms]
          description: OTP delivery channel.
        email:
          type: string
          nullable: true
          description: Required when `connection` is `email`.
        phone_number:
          type: string
          nullable: true
          description: Required when `connection` is `sms`.

    PasswordlessVerifyPayload:
      type: object
      required: [type, otp, connection]
      properties:
        type:
          type: string
          const: passwordless.verify
        otp:
          type: string
          description: One-time password entered by the user.
        connection:
          type: string
          enum: [email, sms]
        email:
          type: string
          nullable: true
          description: Required when `connection` is `email`.
        phone_number:
          type: string
          nullable: true
          description: Required when `connection` is `sms`.
        migrate_history:
          type: boolean
          default: false
          description: Whether to migrate anonymous conversation history to the authenticated user.

    SdkSessionCreatePayload:
      type: object
      required: [type, api_key]
      properties:
        type:
          type: string
          const: sdk.session.create
        api_key:
          type: string
          description: "Partner's public API key (e.g., `pk-sunnyagents_...`)."

    # --- Server -> Client Payloads ---

    SessionStartedPayload:
      type: object
      required: [type, session_id]
      properties:
        type:
          type: string
          const: session.started
        session_id:
          type: string
          description: Server-generated or client-provided session ID.

    SdkSessionCreatedPayload:
      type: object
      required: [type, partner_id, config]
      properties:
        type:
          type: string
          const: sdk.session.created
        partner_id:
          type: string
          format: uuid
          description: Partner ID associated with the verified API key.
        config:
          $ref: "#/components/schemas/SdkAuthConfig"
        brand:
          $ref: "#/components/schemas/SdkBrandConfig"

    SdkSessionCreateFailedPayload:
      type: object
      required: [type, error, code]
      properties:
        type:
          type: string
          const: sdk.session.create_failed
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Machine-readable error code (e.g., `INVALID_API_KEY`, `PARTNER_NOT_FOUND`).

    AuthUpgradedPayload:
      type: object
      required: [type, user_id]
      properties:
        type:
          type: string
          const: auth.upgraded
        user_id:
          type: string
          format: uuid
          description: Authenticated user's database ID.
        email:
          type: string
          nullable: true
          description: Authenticated user's email (if available).

    AuthUpgradeFailedPayload:
      type: object
      required: [type, error, code]
      properties:
        type:
          type: string
          const: auth.upgrade_failed
        error:
          type: string
        code:
          type: string
          description: |
            Error codes: `INVALID_TOKEN`, `ALREADY_AUTHENTICATED`,
            `SESSION_UPDATE_FAILED`, `PROFILE_SAVE_FAILED`,
            `ADDRESS_SAVE_FAILED`, `INSURANCE_SAVE_FAILED`,
            `DEPENDENT_SAVE_FAILED`, `PARTNER_REQUIRED`.

    AuthRefreshPayload:
      type: object
      required: [type, token]
      properties:
        type:
          type: string
          const: auth.refresh
        token:
          type: string
          description: Fresh access token to replace the expiring one.

    AuthRefreshedPayload:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: auth.refreshed

    AuthRefreshFailedPayload:
      type: object
      required: [type, error, code]
      properties:
        type:
          type: string
          const: auth.refresh_failed
        error:
          type: string
        code:
          type: string
          description: |
            Error codes: `INVALID_TOKEN`, `NOT_AUTHENTICATED`, `INTERNAL_ERROR`.

    PasswordlessOtpSentPayload:
      type: object
      required: [type, connection]
      properties:
        type:
          type: string
          const: passwordless.otp_sent
        connection:
          type: string
          enum: [email, sms]
          description: Connection type used.

    PasswordlessOtpSentFailedPayload:
      type: object
      required: [type, error, code]
      properties:
        type:
          type: string
          const: passwordless.otp_sent_failed
        error:
          type: string
        code:
          type: string
          description: |
            Error codes: `PARTNER_REQUIRED`, `INVALID_CONNECTION`,
            `PARTNER_NOT_FOUND`, `AUTH0_CREDENTIALS_MISSING`,
            `OTP_SEND_FAILED`, `INTERNAL_ERROR`.

    PasswordlessVerifyFailedPayload:
      type: object
      required: [type, error, code]
      properties:
        type:
          type: string
          const: passwordless.verify_failed
        error:
          type: string
        code:
          type: string
          description: |
