          $ref: "#/components/schemas/ErrorObject"

    ResponseStreamEventPayload:
      type: object
      required: [type, conversation_id]
      description: |
        AI response streaming events forwarded from the upstream provider.
        Each event has a `type` field (e.g., `response.output_text.delta`)
        and a `conversation_id` for client-side routing.

        Common event types and their key fields:

        | Type | Key Fields | Description |
        |------|------------|-------------|
        | `response.created` | `response` | Response object created |
        | `response.queued` | `response` | Response queued for processing |
        | `response.in_progress` | `response` | Response processing started |
        | `response.output_text.delta` | `delta`, `item_id`, `content_index` | Incremental text chunk |
        | `response.output_text.done` | `text`, `item_id`, `content_index` | Final complete text for a content part |
        | `response.output_item.added` | `item`, `output_index` | New output item (message, tool call, etc.) |
        | `response.output_item.done` | `item`, `output_index` | Output item finalized |
        | `response.content_part.added` | `part`, `item_id`, `content_index` | New content part within an output item |
        | `response.content_part.done` | `part`, `item_id`, `content_index` | Content part finalized |
        | `response.completed` | `response` | Full response object with all output |
        | `response.failed` | `response` | Response generation failed |
        | `response.incomplete` | `response` | Response truncated (max tokens, etc.) |
        | `response.mcp_call.in_progress` | `item_id` | MCP tool call started |
        | `response.mcp_call.completed` | `item_id` | MCP tool call finished |
        | `response.mcp_call.failed` | `item_id` | MCP tool call failed |
        | `response.output_text.annotation.added` | `annotation`, `item_id` | URL/file citation added |
      properties:
        type:
          type: string
          description: Event type following `response.*` naming convention.
        conversation_id:
          type: string
          format: uuid
          description: Conversation this event belongs to (for multiplexing).
      additionalProperties: true

    # --- Shared Schemas ---

    FileAttachment:
      type: object
      required: [filename, mime_type, content, size]
      description: Base64-encoded file attachment for upload.
      properties:
        filename:
          type: string
          description: Original filename.
        mime_type:
          type: string
          description: MIME type (e.g., `image/png`, `application/pdf`).
        content:
          type: string
          description: Base64-encoded file content.
        size:
          type: integer
          format: int64
          description: File size in bytes (max 10 MB).

    ErrorObject:
      type: object
      required: [message, code]
      description: Structured error envelope used in all error responses.
      properties:
        message:
          type: string
          description: Human-readable error description.
        code:
          type: string
          description: |
            Machine-readable error code. Common codes:

            - `AUTH_FAILED` — authentication failed
            - `PARSE_ERROR` — malformed JSON message
            - `CONVERSATION_NOT_FOUND` — conversation does not exist or access denied
            - `CONVERSATION_ACCESS_DENIED` — insufficient permissions
            - `SDK_SESSION_REQUIRED` — SDK session not yet created
            - `ORIGIN_NOT_ALLOWED` — connection origin rejected
            - `SESSION_REVOKED` / `SESSION_EXPIRED` / `SESSION_NOT_FOUND`
            - `PROCESSING_ERROR` — generic server-side processing failure
            - `SEND_ERROR` / `INTERNAL_ERROR`
        conversation_id:
          type: string
          format: uuid
          nullable: true
          description: Conversation ID when the error is conversation-scoped.

    AuthUpgradeProfile:
      type: object
      nullable: true
      description: Optional user profile data sent with auth.upgrade (partner pre-collected).
      properties:
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        date_of_birth:
          type: string
          nullable: true
          description: Date of birth in YYYY-MM-DD format.
        gender:
          type: string
          nullable: true
          description: "Gender (e.g., `male`, `female`, `other`)."

    AuthUpgradeAddress:
      type: object
      nullable: true
      required: [address_line_1, city, state, zip_code]
      description: Optional user address sent with auth.upgrade (partner pre-collected).
      properties:
        address_line_1:
          type: string
        address_line_2:
          type: string
          nullable: true
        city:
          type: string
        state:
          type: string
        zip_code:
          type: string
        country:
          type: string
          default: USA

    AuthUpgradeInsurance:
      type: object
      required: [member_id, group_id]
      description: >-
        Insurance record sent with auth.upgrade. Backend resolves via enterprise
        partner plans. Provide exactly one of `partner_plan_id` or `plan_alias`.
      properties:
        partner_plan_id:
          type: string
          format: uuid
          description: Partner plan ID (from enterprise configuration). Provide this OR `plan_alias`.
        plan_alias:
          type: string
          description: >-
            Developer-defined plan alias, resolved at runtime against the partner's
            configured aliases. Provide this OR `partner_plan_id`.
        member_id:
          type: string
        group_id:
          type: string

    AuthUpgradeDependent:
      type: object
      required: [first_name, last_name, date_of_birth, relationship_code]
      description: Dependent record sent with auth.upgrade (SDK partner pre-collected data).
      properties:
        first_name:
          type: string
        last_name:
          type: string
        date_of_birth:
          type: string
          description: Date of birth in YYYY-MM-DD format.
        gender:
          type: string
          nullable: true
        relationship_code:
          type: string
          description: "Stedi relationship code (e.g., `01` = spouse, `19` = child)."
        member_id:
          type: string
          nullable: true
          description: Member ID for this dependent (if different from subscriber).
        insurance_index:
          type: integer
          nullable: true
          description: Index into the `insurances` array to link to a specific plan. If omitted, defaults to the first plan.

    SdkAuthConfig:
      type: object
      description: Server-provided auth configuration returned in `sdk.session.created`. Public fields only.
      properties:
        auth0_client_id:
          type: string
          nullable: true
          description: Auth0 SPA client ID (public, no secret). Used by token exchange.
        audience:
          type: string
          nullable: true
          description: API audience for access tokens.
        organization:
          type: string
          nullable: true
          description: Auth0 organization ID.
        token_exchange_url:
          type: string
          nullable: true
          description: Override URL for token exchange endpoint.

    SdkBrandConfig:
      type: object
      nullable: true
      description: Optional brand theming for the SDK widget.
      properties:
        name:
          type: string
        primaryColor:
          type: string
        secondaryColor:
          type: string
        logoUrl:
          type: string
          nullable: true

    Conversation:
      type: object
      required: [id]
      description: Conversation object.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
          description: Optional conversation title.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Message:
      type: object
      required: [id, conversation_id, user_id, content, created_at]
      description: Stored message within a conversation.
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          type: string
          nullable: true
          enum: [user, assistant, system]
        content:
          type: array
          description: Array of content items (OpenAI ResponseInputItem or ResponseOutputItem JSON).
          items:
            type: object
            additionalProperties: true
        created_at:
          type: string
          format: date-time
        feedback:
          type: boolean
          nullable: true
          description: User feedback on the message (true = positive, false = negative).

    UploadedFile:
      type: object
      required: [id, conversation_id, filename, mime_type, file_size]
      description: Server record of an uploaded file.
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        filename:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
          format: int64

    Appointment:
      type: object
      description: Full appointment record with related data.
      properties:
        appointment:
          type: object
          description: Core appointment fields.
          additionalProperties: true
      additionalProperties: true

    ChatCancelledMetadata:
      type: object
      required: [step]
      properties:
        step:
          type: string
          description: Cancellation step (e.g., `cancelled`).

    QuickResponse:
      type: object
      required: [text]
      description: Suggested quick-reply option.
      properties:
        text:
          type: string
          description: Suggested response text.
        is_profile_prompt:
          type: boolean
          nullable: true
          description: Whether this prompt is asking for profile information.
