# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: sunnyhealth.docs.buildwithfern.com
    custom-domain: docs.sunnyhealthai.com
ai-search:
  location:
    - docs
title: Sunny Agents SDK
layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header
products:
  - display-name: Ask Sunny
    path: ./products/ask-sunny.yml
    icon: fa-solid fa-sun
    slug: ask-sunny
navbar-links:
  - type: minimal
    text: GitHub
    url: https://github.com/sunnyhealthai/sunny-agents-sdk
  - type: filled
    text: Get Support
    url: mailto:support@sunnyhealthai.com
colors:
  accentPrimary:
    dark: '#006fff'
    light: '#006fff'
theme:
  page-actions: toolbar
  footer-nav: minimal
logo:
  dark: docs/assets/logo.svg
  light: docs/assets/logo.svg
  height: 50
favicon: docs/assets/favicon.png
